<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle-of-time</title>

    <link rel="stylesheet" href="/styles/style.css">
    
</head>

<body>
  <header>
    <div class="header">

        <img src="/assets/logo.png" class="logo">

        <h1 class="title"> Bottle Of Time </h1>

        <div class="header-right"></div>
            <div id="theme-toggle">☀️/🌙</div>
            <div id="user-toggle"> 🐍 usuario</div> 
        </div>

    </div>    

  </header>  
  <dialog id="modal-settings">
    <aside id="aside-bar">

        <button id="toggle-menu"> ☰ </button>
        <button> Ajustes </button>
        <button> Temas </button>
        <button> Ayuda </button>

    </aside>
  </dialog>


  <main>
    <div class="sesion"> Sesión 0</div>
    <div class="temporizador">00:00</div>
    <div class="modo-actual">Modo Creación</div>

    <div class="controles">
        <button>Iniciar</button>
        <button>Pausar</button>
        <button>Reiniciar</button>

    </div>
  </main>

</body>

</html>
