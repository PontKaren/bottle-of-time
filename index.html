<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle-of-time</title>

    <link rel="stylesheet" href="/styles/style.css">
    
</head>

<body>
  <header>
    <div class="header">

      <div class="header-top">
        <div class="brand">

          <img src="/assets/logo.png" class="logo">

          <h1 class="title"> Bottle Of Time </h1>

        </div>

        <div class="header-action">

            <button id="theme-toggle">☀️/🌙 Tema </button>

            <button id="user-toggle">🐍 Usuario</button>


        </div>
      </div>

    </div>    

    <button id="toggle-menu"> ☰ </button>

  </header> 
  
  <div class="app-content">
    <aside id="aside-bar">

      <button> Ajustes </button>
      <button> Temas </button>
      <button> Ayuda </button>

    </aside>
  </div>

  <main>
    <div class="sesion"> Sesión 0</div>
    <div class="temporizador">00:00</div>
    <div class="modo-actual">Modo Creación</div>

    <div class="controles">
        <button>Iniciar</button>
        <button>Pausar</button>
        <button>Reiniciar</button>

    </div>
  </main>

</body>

</html>
